<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>归巢 · 城市定居测评 — 5 分钟找到你的城市</title>
<meta name="description" content="基于霍华德《明日的田园城市》与芒福德《城市发展史》的城市定居测评。33 题, 5 分钟, 用 2026 年最新官方政策数据为你匹配最适合的一二线城市。">
<style>
:root {
  --blue: #002FA7;       /* 克莱因蓝 */
  --blue-deep: #001F6B;
  --amber: #F8B500;
  --bg: #F7F8FC;
  --ink: #1A1F36;
  --muted: #6B7280;
  --card: #FFFFFF;
  --radius: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
  background: var(--bg); color: var(--ink); min-height: 100vh;
}
#app { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }

/* ---- 欢迎页 ---- */
.hero { text-align: center; padding: 48px 0 32px; }
.hero .logo {
  display: inline-block; background: var(--blue); color: #fff;
  font-weight: 700; font-size: 40px; padding: 16px 28px; border-radius: 20px;
  letter-spacing: 8px;
}
.hero h1 { font-size: 28px; margin: 24px 0 12px; }
.hero p.sub { color: var(--muted); font-size: 16px; line-height: 1.7; }
.hero .theory {
  margin: 20px auto; padding: 14px 18px; background: #EEF1FB; border-radius: 12px;
  font-size: 13px; color: #3B4A8C; max-width: 520px; line-height: 1.7;
}
.hero .stats { display: flex; justify-content: center; gap: 28px; margin: 24px 0; }
.hero .stats div { text-align: center; }
.hero .stats b { display: block; font-size: 26px; color: var(--blue); }
.hero .stats span { font-size: 12px; color: var(--muted); }
.btn-main {
  display: block; width: 100%; max-width: 420px; margin: 12px auto;
  background: var(--blue); color: #fff; border: none; border-radius: 999px;
  font-size: 19px; font-weight: 600; padding: 18px; cursor: pointer;
  transition: transform .15s;
}
.btn-main:hover { transform: translateY(-2px); background: var(--blue-deep); }

/* ---- 答题 ---- */
.quiz-progress { height: 6px; background: #E5E8F2; border-radius: 3px; margin: 12px 0 32px; overflow: hidden; }
.quiz-progress i { display: block; height: 100%; background: var(--blue); border-radius: 3px; transition: width .3s; }
.quiz-count { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.q-card { background: var(--card); border-radius: var(--radius); padding: 32px 24px; box-shadow: 0 4px 24px rgba(26,31,54,.06); }
.q-dim { font-size: 12px; color: var(--blue); background: #EEF1FB; display: inline-block; padding: 4px 12px; border-radius: 99px; margin-bottom: 16px; }
.q-text { font-size: 21px; font-weight: 600; line-height: 1.5; margin-bottom: 28px; }
.opt {
  display: block; width: 100%; text-align: left; margin-bottom: 12px;
  background: #F3F4F9; color: var(--ink); border: 2px solid transparent;
  border-radius: 12px; padding: 16px 18px; font-size: 16px; cursor: pointer;
  transition: all .15s;
}
.opt:hover { border-color: var(--blue); background: #EEF1FB; }
.opt.selected { border-color: var(--blue); background: var(--blue); color: #fff; }
.quiz-nav { display: flex; justify-content: space-between; margin-top: 16px; }
.quiz-nav .ghost { visibility: hidden; }
.quiz-nav .ghost.show { visibility: visible; }

/* ---- 结果 ---- */
.result h3 { margin: 28px 0 14px; }
.profile-card {
  background: var(--blue); color: #fff; border-radius: var(--radius);
  padding: 36px 28px; text-align: center;
}
.pc-badge { font-size: 13px; letter-spacing: 2px; opacity: .8; }
.pc-name { font-size: 56px; font-weight: 700; margin: 8px 0; }
.pc-tagline { color: var(--amber); font-size: 18px; margin-bottom: 20px; }
.pc-3lines { text-align: left; background: rgba(255,255,255,.10); border-radius: 12px; padding: 16px 20px; font-size: 14px; line-height: 2; }
.pc-3lines b { color: var(--amber); }

.dims-bar .dim-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.dims-bar .dim-row span { width: 72px; font-size: 14px; color: var(--muted); text-align: right; }
.dims-bar .bar { flex: 1; height: 10px; background: #E5E8F2; border-radius: 5px; overflow: hidden; }
.dims-bar .bar i { display: block; height: 100%; background: var(--blue); border-radius: 5px; }
.dims-bar b { width: 32px; font-size: 14px; }

.city-cards { display: grid; gap: 14px; }
.city-card { background: var(--card); border-radius: var(--radius); padding: 20px 22px; box-shadow: 0 4px 24px rgba(26,31,54,.06); position: relative; }
.city-card.filtered { opacity: .75; }
.cc-rank { position: absolute; top: 18px; right: 20px; font-size: 28px; font-weight: 800; color: #E5E8F2; }
.cc-name { font-size: 24px; font-weight: 700; }
.cc-name small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.cc-match { font-size: 42px; font-weight: 800; color: var(--blue); margin: 6px 0; }
.cc-match small { font-size: 16px; }
.cc-match span { font-size: 13px; color: var(--muted); margin-left: 8px; font-weight: 400; }
.cc-scores { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.cc-scores .chip { font-size: 12px; background: #EEF1FB; color: #3B4A8C; padding: 4px 10px; border-radius: 99px; }
.cc-meta { font-size: 12.5px; color: var(--muted); line-height: 1.8; }
.cc-warn { margin-top: 8px; font-size: 13px; color: #B45309; background: #FFFBEB; padding: 8px 12px; border-radius: 8px; }

.compare table { width: 100%; background: var(--card); border-radius: var(--radius); overflow: hidden; border-collapse: collapse; box-shadow: 0 4px 24px rgba(26,31,54,.06); }
.compare th, .compare td { padding: 10px 14px; font-size: 14px; text-align: left; border-bottom: 1px solid #F0F1F6; }
.compare th { background: #F3F4F9; font-weight: 600; }
.compare td:first-child { color: var(--muted); }
.compare-selects { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.compare-selects select { padding: 8px 12px; border-radius: 8px; border: 1px solid #D8DBE8; font-size: 15px; background: #fff; }

.share-row { display: flex; gap: 12px; margin: 28px 0 12px; }
.share-row button { flex: 1; padding: 16px; border-radius: 999px; border: none; font-size: 17px; font-weight: 600; cursor: pointer; }
#btnShare { background: var(--blue); color: #fff; }
#btnRestart { background: transparent; border: 2px solid #D8DBE8; color: var(--muted); }
.data-note { font-size: 11.5px; color: #9CA3AF; text-align: center; line-height: 1.7; }

footer { text-align: center; margin-top: 40px; font-size: 12px; color: #9CA3AF; line-height: 1.8; }
</style>
</head>
<body>
<div id="app"></div>
<footer>
  归巢 · 城市定居测评 — 理论基础: 霍华德《明日的田园城市》· 芒福德《城市发展史》<br>
  数据: 2026 年各市官方公告(双源交叉验证) · 本测评仅供决策参考
</footer>

<script type="module">
import { QUESTIONS } from './src/questions.js';
import { renderResult } from './src/result.js';

const app = document.getElementById('app');
const KEY = 'guichao_answers';
let answers = JSON.parse(localStorage.getItem(KEY) || '{}');
let idx = 0;

// ---------- 欢迎页 ----------
function renderWelcome() {
  app.innerHTML = `
    <div class="hero">
      <div class="logo">归巢</div>
      <h1>你该在哪座城市扎根?</h1>
      <p class="sub">33 道题 · 5 分钟 · 基于 2026 年最新官方政策数据<br>给你一份可执行的定居指引</p>
      <div class="theory">灵感来自霍华德「三磁体」与芒福德「城市是人的容器」——<br>不止算经济账, 更算生活账。</div>
      <div class="stats">
        <div><b>8</b><span>座一二线城市</span></div>
        <div><b>33</b><span>道情景题</span></div>
        <div><b>26</b><span>项官方数据/城</span></div>
      </div>
      <button class="btn-main" id="btnStart">开始测评 →</button>
    </div>`;
  document.getElementById('btnStart').onclick = () => { idx = 0; renderQuestion(); };
}

// ---------- 答题页 ----------
const dimName = { ambition: '事业雄心', lifestyle: '生活偏好', family: '家庭因素', economy: '经济基础', risk: '风险态度' };

function renderQuestion() {
  if (idx >= QUESTIONS.length) { renderResult(answers, app); return; }
  const q = QUESTIONS[idx];
  app.innerHTML = `
    <div class="quiz-progress"><i style="width:${(idx / QUESTIONS.length) * 100}%"></i></div>
    <div class="quiz-count">${idx + 1} / ${QUESTIONS.length} · ${dimName[q.dimension]}</div>
    <div class="q-card">
      <span class="q-dim">${dimName[q.dimension]}${q.reverse ? ' · 逆向题' : ''}</span>
      <div class="q-text">${q.text}</div>
      ${q.options.map((o, i) =>
        `<button class="opt ${answers[q.id] === i ? 'selected' : ''}" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="quiz-nav">
      <button class="ghost ${idx > 0 ? 'show' : ''}" id="btnBack">← 上一题</button>
      <button class="ghost ${answers[q.id] != null ? 'show' : ''}" id="btnNext">下一题 →</button>
    </div>`;

  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      answers[q.id] = +btn.dataset.i;
      localStorage.setItem(KEY, JSON.stringify(answers));
      setTimeout(() => { idx++; renderQuestion(); }, 180);
    };
  });
  const back = document.getElementById('btnBack');
  const next = document.getElementById('btnNext');
  if (back) back.onclick = () => { idx--; renderQuestion(); };
  if (next) next.onclick = () => { idx++; renderQuestion(); };
}

// ---------- 入口 ----------
if (Object.keys(answers).length === QUESTIONS.length) renderResult(answers, app);
else if (Object.keys(answers).length > 0) {
  // 断点续答: 从第一道未答的题开始
  idx = QUESTIONS.findIndex(q => answers[q.id] == null);
  if (idx === -1) idx = QUESTIONS.length;
  renderWelcome(); // 先给欢迎页, 点开始后继续
  document.getElementById('btnStart').onclick = () => renderQuestion();
  document.getElementById('btnStart').textContent = `继续测评 (已答 ${Object.keys(answers).length}/${QUESTIONS.length}) →`;
} else renderWelcome();
</script>
</body>
</html>
